id: coil-expansion
stated: 'Spec 11 §5 ka pehla loop run: 8 me se sirf EK miss aisa tha jahan koi detector
  hi

  nahi tha — 10:34 wala move, jiska origin `pre-ranges [5.3, 7.0, 69.0]` dikhata hai

  ATR 24.9 ke against. Do bilkul chup candles, phir 69-point expansion.

  Dawa: jab ek chhota group apne se pehle ke shor se saaf compress ho jaata hai, to

  agla stretch pehle se ZYADA loud hota hai.

  '
mechanism: 'Compression means participants have stopped disagreeing about price; the
  range

  narrows because nobody will pay up and nobody will hit the bid. That state is

  unstable — the first participant willing to disagree finds no resting orders in
  the

  way, so the move that follows is larger than the one that preceded the quiet.

  '
clauses:
- capability: span_compression
  op: <=
  value: '0.5'
span_len: 4
outcome: expansion
horizon: 10
k: '1.2'
predicted_rate: 40% — spec 11 §D3 warns a compression detector fires on everything,
  so I expect this to be near the base rate, not above it.
